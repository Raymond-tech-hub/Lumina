[project]
name = "lumina"
version = "0.1.0"
description = "AI-powered adaptive learning platform built with Python and KivyMD."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
